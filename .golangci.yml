version: "2"

run:
  timeout: 5m
  go: "1.27"

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/ygelfand/libcountertop

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net.Conn).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    paths:
      - pkg/display/compositor/internal/(bin|debug|objstore|set|wire|wlclient|xsync)/
      - pkg/display/compositor/internal/wayland/(client|server)\.go
    rules:
      - linters: [errcheck]
        source: "^\\s*defer "

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
