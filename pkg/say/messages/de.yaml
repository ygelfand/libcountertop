    _: Pipeline
    preferred: Bevorzugt
  reply: Antwortwiedergabe
  setting:
    arbitration_offset:
      _: Arbitrierungsversatz
      help: Dezibel, die zur Aktivierungswertung dieses Geräts addiert werden, wenn Geräte in der Nähe um die Antwort konkurrieren, ±20
    arbitration_wait:
      _: Arbitrierungswartezeit
      help: Millisekunden Wartezeit auf andere Geräte, die dasselbe Aktivierungswort gehört haben, bis 500; 0 antwortet sofort
    buffer:
      _: Antwortpuffer
      help: Millisekunden gestreamter Antwort, die vor der Wiedergabe gepuffert werden, 0 bis 3000
    delivery:
      _: Antwortwiedergabe
      help: Spielt die Antwort ab, wenn sie vollständig ist, oder streamt sie, während das Audio ankommt
    follow_up:
      _: Nachfragezeit
      help: Sekunden, die nach einer Antwort ohne Aktivierungswort erneut zugehört wird; 0 schaltet es aus
    gemini:
      _: Gemini-Aktivierungswort
      help: Bietet Googles Aktivierungswort „Hey Google“ an und lädt das Modell bei Auswahl herunter
    known_voices:
      _: Nur erkannte Stimmen
      help: Startet eine Anfrage nur, wenn das Aktivierungswort zu einem eingelernten Stimmprofil passt
    look:
      listening:
        _: Visualisierung beim Zuhören
        help: Visualisierung während der Assistent zuhört, gesteuert vom Mikrofon; Standard behält die eingebaute Darstellung
      place:
        _: Platzierung der Visualisierung
        help: Zeigt die gewählten Visualisierungen im Assistentenbereich oder im Vollbild
      responding:
        _: Visualisierung beim Antworten
        help: Visualisierung während die Antwort spielt, gesteuert vom Lautsprecher; Standard behält die eingebaute Darstellung
      waiting:
        _: Visualisierung beim Warten
        help: Visualisierung während auf die Antwort gewartet wird, gesteuert von Mikrofon und Lautsprecher; Standard behält die eingebaute Darstellung
    max_listen:
      _: Maximale Zuhörzeit
      help: Sekunden, die der Assistent auf eine Anfrage hört, bevor er aufgibt, 5 bis 60
    max_think:
      _: Maximale Denkzeit
      help: Sekunden Wartezeit auf eine Antwort, bevor aufgegeben wird, 5 bis 300
    pryon:
      _: Amazon-Aktivierungswörter
      help: Bietet Amazons Pryon-Aktivierungswörter an und lädt Bibliothek und Modelle bei Auswahl herunter
    pryon_stop:
      _: Amazon-Stoppwort
      help: Nutzt Amazons Pryon-Schlüsselwort „Stop“, um Antworten zu unterbrechen; erfordert aktive Amazon-Aktivierungswörter
    recordings:
      _: Aufbewahrte Aufnahmen
      help: Wie viele der letzten Anfragen dieser Assistent als Audio auf dem Gerät behält, bis 10; 0 behält keine
    stop_sensitivity:
      _: Stoppwort-Empfindlichkeit
      help: Erkennungsschwelle für das Stoppwort, das eine Antwort unterbricht, 50 bis 100 %; 100 % schaltet es aus
    threshold:
      _: Empfindlichkeit des Aktivierungsworts
      help: Wertung, die ein Aktivierungswort zum Auslösen erreichen muss, 50 bis 99 %
    tone:
      _: Aktivierungston
      help: Ton, der beim Erkennen des Aktivierungsworts abgespielt wird
    wake_screen:
      _: Bildschirm aufwecken
      help: Schaltet den Bildschirm ein, wenn dieses Aktivierungswort gehört wird
