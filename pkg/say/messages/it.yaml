      _: Parola di attivazione Gemini
      help: Offre la parola di attivazione "Hey Google", scaricando il modello quando scelta
    known_voices:
      _: Solo voci riconosciute
      help: Avvia una richiesta solo se la parola di attivazione corrisponde a un profilo vocale registrato
    look:
      listening:
        _: Grafica in ascolto
        help: Grafica mostrata mentre l'assistente ascolta, guidata dal microfono; Predefinito mantiene l'aspetto incluso
