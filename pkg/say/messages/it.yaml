        _: Grafica in attesa
        help: Grafica mostrata in attesa della risposta, guidata da microfono e altoparlante; Predefinito mantiene l'aspetto incluso
    max_listen:
      _: Ascolto massimo
      help: Secondi di ascolto della richiesta prima di rinunciare, da 5 a 60
    max_think:
      _: Elaborazione massima
      help: Secondi di attesa della risposta prima di rinunciare, da 5 a 300
    pryon:
      _: Parole di attivazione Amazon
      help: Offre le parole di attivazione Pryon di Amazon, scaricando libreria e modelli quando scelte
    pryon_stop:
      _: Parola di stop Amazon
      help: Usa la parola "Stop" di Pryon di Amazon per interrompere le risposte; richiede le parole Amazon
    recordings:
      _: Registrazioni conservate
      help: Quante richieste recenti di questo assistente conservare come audio sul dispositivo, fino a 10; 0 nessuna
    stop_sensitivity:
      _: Sensibilità parola di stop
      help: Soglia di rilevamento della parola stop che interrompe una risposta, dal 50 al 100%; 100% la disattiva
