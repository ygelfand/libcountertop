assistants:
  arbitration:
    offset: '{{.N}} dB'
    value: '{{.N}} ms'
  group:
    arbitration: Arbitration
    gemini: Gemini
    pryon: Pryon
    stopword: Stop word
  pipeline:
    _: Pipeline
    preferred: Preferred
  reply: Response playback
  setting:
    arbitration_offset:
      _: Arbitration offset
      help: Decibels added to this device's wake score when nearby devices compete to answer, ±20
    arbitration_wait:
      _: Arbitration wait
      help: Milliseconds to wait for other devices that heard the same wake word, up to 500; 0 answers at once
    buffer:
      _: Reply buffer
      help: Milliseconds of streamed reply audio held before playback starts, 0 to 3000
    delivery:
      _: Response playback
      help: Plays the reply once it is complete, or streams it as the audio arrives
    follow_up:
      _: Follow-up time
      help: Seconds to listen again without the wake word after a reply; 0 turns it off
    gemini:
      _: Gemini wake word
      help: Offers Google's "Hey Google" wake word, downloading its model when chosen
    known_voices:
      _: Recognized voices only
      help: Starts a request only when the wake word matches an enrolled voice profile
    look:
      listening:
        _: Listening visual
        help: Visual shown while the assistant listens, driven by the microphone; Default keeps the built-in look
      place:
        _: Visual placement
        help: Shows the chosen assistant visuals in the assistant panel or across the full screen
      responding:
        _: Responding visual
        help: Visual shown while the reply plays, driven by the speaker; Default keeps the built-in look
      waiting:
        _: Waiting visual
        help: Visual shown while waiting for the answer, driven by microphone and speaker; Default keeps the built-in look
    max_listen:
      _: Max listening time
      help: Seconds the assistant listens for a request before giving up, 5 to 60
    max_think:
      _: Max thinking time
      help: Seconds to wait for an answer before giving up, 5 to 300
    pryon:
      _: Amazon wake words
      help: Offers Amazon's Pryon wake words, downloading the library and models when chosen
    pryon_stop:
      _: Amazon stop word
      help: Uses Amazon's Pryon "Stop" keyword to interrupt replies; needs Amazon wake words on
    recordings:
      _: Recordings kept
      help: How many of the latest requests' audio this assistant keeps on the device, up to 10; 0 keeps none
    stop_sensitivity:
      _: Stop word sensitivity
      help: Detection threshold for the stop word that interrupts a reply, 50 to 100%; 100% turns it off
    threshold:
      _: Wake word sensitivity
      help: Score a wake word must reach to trigger, 50 to 99%
    tone:
      _: Wake sound
      help: Sound played when the wake word is accepted
    wake_screen:
      _: Wake the screen
      help: Turns the screen on when this wake word is heard
