actions:
  alarm:
    _: Manage alarms
    ambiguous: More than one alarm matches; say its name
    daily: every day
    delete: Deleted {{.Alarm}}
    disable: Disabled {{.Alarm}}
    empty: You have no saved alarms
    enable: Enabled {{.Alarm}}
    exists: '{{.Alarm}} already exists'
    missing: No saved alarm matches that name or time
    named: '{{.Name}} at {{.Clock}}'
    next: Your next alarm is {{.Alarm}}, {{.When}}
    none: You have no upcoming alarm
    not_ringing: No alarm is ringing
    not_snoozed: No ringing alarm can be snoozed
    'off': '{{.Alarm}}, disabled'
    once: one time
    sentence:
      delete: (delete|remove|cancel) [my|the] {target} alarm
      disable: (disable|turn off) [my|the] {target} alarm
      enable: (enable|turn on) [my|the] {target} alarm
      list: list [my] alarms
      list_what: what are my alarms
      next: when is [my|the] next alarm
      set: (set|create|add) [a|an] alarm (for|at) {time}
      set_named: (set|create|add) [a|an] alarm (called|named) {name} (for|at) {time}
      snooze: snooze [my|the] alarm
      snooze_bare: snooze
      stop: (stop|dismiss) [my|the] alarm
    set: Set {{.Alarm}}
    snoozed: Alarm snoozed
    stopped: Alarm stopped
    target: Say the alarm name, time, or next alarm
    time: Say a time such as seven thirty AM, optionally followed by every weekday, every weekend, every day, or on named weekdays
    weekdays: weekdays
    weekends: weekends
    when: '{{.Day}} at {{.Clock}}'
  broadcast:
    _: Broadcast a message
    ask: Go ahead after the tone
    sentence:
      ask: (broadcast|announce)
      message: (broadcast|announce) {message}
      send: send a broadcast
    text: Broadcasting typed text needs the Home Assistant integration
  call:
    _: Call a device
    busy: Already in a call
    foreign: '{{.Peer}} isn''t in this home'
    sentence:
      call: (call|ring|intercom) [the] {peer}
      video: video call [the] {peer}
    unknown: There's no device called {{.Peer}}
    unreachable: '{{.Peer}} can''t be reached'
  call_answer:
    _: Answer a call
    done: Answering the call
    none: No incoming call to answer
    sentence:
      bare: answer
      call: answer [the] (call|phone)
      video: answer [the] video call
  call_hangup:
    _: Hang up a call
    done: Call ended
    none: No call to hang up
    sentence:
      bare: hang up
      call: hang up [the] (call|phone)
      end: (end|decline|reject) [the] call
  recipes:
    _: Cook from recipes
    amount: You need {{.Amount}}
    closed: No recipe is open for cooking
    cooking: Let's cook {{.Recipe}}.
    first: This is the first step
    found: Here are recipes for {{.Query}}
    last: That was the last step
    missing: '{{.Ingredient}} isn''t in this recipe'
    none: No recipes match {{.Query}}
    nosteps: This recipe has no steps
    notimer: This step has no timer
    sentence:
      amount: how much {ingredient} [do i need]
      amount_many: how many {ingredient} [do i need]
      cook: (start cooking|let's cook|let's make|i want to cook) {recipe}
      find: (find|search for|look up) [some] recipe[s] (for|with) {recipe}
      find_named: find [me] [a] {recipe} recipe[s]
      next: next step
      next_what: what's [the] next step
      previous: (previous|last) step
      repeat: (repeat|read) [the] [current] step
      show: show [me] [the] recipe for {recipe}
      timer: start [the] step timer
    showing: Here's {{.Recipe}}
    step: 'Step {{.N}} of {{.Of}}: {{.Text}}'
    timer: Timer started for {{.Minutes}} minute{{if ne .Minutes 1}}s{{end}}
    unreachable: I couldn't reach Mealie
    unset: Set up Mealie in the Recipes app first
    which: Which recipe?
  youtube_tv:
    _: Watch YouTube TV
    airing: '{{.Channel}} is showing {{.Title}}'
    channel: Say a channel or a show
    device: There's no device called {{.Device}}
    here:
      _: Playing {{.Show}} on {{.Channel}}
      channel: Playing {{.Channel}}
    nothing: Nothing is listed on {{.Channel}} right now
    nowhere: Choose a default TV in the TV app
    sentence:
      watch: (watch|put on) {channel}
      watch_on: (watch|put on) {channel} on [the] {device}
      what_is_on: what is on {channel}
      whats_on: what's on {channel}
    unknown: I looked for {{.Channel}} on YouTube TV, but it either isn't available or can't be played right now
    watching:
      _: Playing {{.Show}} on {{.Channel}} on {{.Device}}
      channel: Playing {{.Channel}} on {{.Device}}
